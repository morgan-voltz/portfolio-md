<!doctype html>
<!--
  The source of theme/portfolio-md-child/assets/og-image.png, the default image of the social
  cards (ADR-027): the brand's logo for dark backgrounds (theme/logos/), then a line and the
  address of the site. Not deployed: deploy-o2switch.sh ships theme/portfolio-md-child/ only.
  Language-neutral on purpose: one image serves the three languages of the site.
  To regenerate it, from the root of the repository (the second command recompresses the PNG
  without changing a pixel, to about a third of its size):
    chromium-browser --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=3000 \
      --allow-file-access-from-files --window-size=1200,630 \
      --screenshot=theme/portfolio-md-child/assets/og-image.png \
      "file://$PWD/theme/og-image/og-image.html"
    magick theme/portfolio-md-child/assets/og-image.png -strip -define png:compression-level=9 \
      -define png:compression-filter=5 -define png:compression-strategy=1 \
      theme/portfolio-md-child/assets/og-image.png
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Morgan Voltz</title>
<style>
	@font-face {
		font-family: "Space Grotesk Variable";
		font-weight: 300 700;
		src: url("../portfolio-md-child/fonts/space-grotesk/space-grotesk-latin-wght-normal.woff2") format("woff2-variations");
	}
	@font-face {
		font-family: "Inter Variable";
		font-weight: 100 900;
		src: url("../portfolio-md-child/fonts/inter/inter-latin-wght-normal.woff2") format("woff2-variations");
	}
	html, body {
		margin: 0;
		width: 1200px;
		height: 630px;
		overflow: hidden;
	}
	body {
		display: flex;
		flex-direction: column;
		justify-content: center;
		box-sizing: border-box;
		padding: 0 96px;
		background: linear-gradient(135deg, #0b1f3a 0%, #12305a 100%);
	}
	img {
		display: block;
		width: 784px;
		height: auto;
	}
	p {
		margin: 40px 0 0;
		font-family: "Space Grotesk Variable", sans-serif;
		font-size: 44px;
		font-weight: 500;
		color: #cbd5e1;
	}
	p.site {
		margin-top: 20px;
		font-family: "Inter Variable", sans-serif;
		font-size: 30px;
		font-weight: 600;
		color: #22d3ee;
	}
</style>
</head>
<body>
	<img src="../logos/logo-morgan-voltz-fond-sombre.svg" alt="">
	<p>Full-stack · Rust · C# · PHP</p>
	<p class="site">morganvoltz.dev</p>
</body>
</html>
