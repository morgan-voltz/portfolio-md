# Noms d'affichage des tags techniques, la taxonomie `tech_tag` (ADR-024, 8 novembre 2026).
#
# Les fiches citent leurs tags par slug (`tags: [csharp, dotnet]`) ; le slug est un identifiant,
# jamais un nom à montrer. Ce fichier donne à chaque slug son nom tel que le site l'affiche,
# dans la langue de la page : le nom français devient le nom du terme WordPress, les noms
# allemand et anglais vont dans les term metas `_portfolio_tag_name_de` et `_portfolio_tag_name_en`.
# L'API de lecture rend `tags[].name` dans la langue demandée, le thème affiche les puces de même.
#
# Deux formes :
#   slug: "Nom"                       # un nom de technologie, le même dans les trois langues
#   slug:                             # un nom qui se traduit
#     name: "Nom français"
#     i18n: { de: "Deutscher Name", en: "English name" }
#
# Règles : un slug valide (minuscules, chiffres, tirets), un nom en texte brut sur une ligne
# (200 caractères au plus, ni balise ni esperluette : WordPress le stockerait changé), `de` et `en`
# tous deux présents dès qu'il y a un bloc `i18n`. Le validateur de contenu refuse une fiche dont un
# tag manque ici ; `wp portfolio tags sync content/tags.yaml` écrit les noms dans WordPress et
# signale les termes qui ne sont plus dans le fichier, sans jamais les supprimer.
#
# Même chose en deux slugs : `api-rest` (HEHEWATT) et `rest-api` (Trace 4.0, UHA Learn) nomment la
# même notion ; les fiches les gardent tels quels, le fichier leur donne le même nom.

